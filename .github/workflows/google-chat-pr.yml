name: Google Chat PR Notifications

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - closed

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send PR notification to Google Chat
        env:
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPOSITORY: ${{ github.repository }}
          MERGED: ${{ github.event.pull_request.merged }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          if [ "$ACTION" = "opened" ]; then
            EMOJI="🆕"
            TITLE="Pull Request Created"
          elif [ "$ACTION" = "edited" ]; then
            EMOJI="✏️"
            TITLE="Pull Request Edited"
          elif [ "$ACTION" = "synchronize" ]; then
            EMOJI="🔄"
            TITLE="Pull Request Updated"
          elif [ "$ACTION" = "reopened" ]; then
            EMOJI="🔓"
            TITLE="Pull Request Reopened"
          elif [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
            EMOJI="🎉"
            TITLE="Pull Request Merged"
          elif [ "$ACTION" = "closed" ]; then
            EMOJI="❌"
            TITLE="Pull Request Closed"
          fi

          MESSAGE="$EMOJI $TITLE

          Repository: $REPOSITORY
          PR: #$PR_NUMBER
          Title: $PR_TITLE
          Author: $PR_AUTHOR
          Branch: $SOURCE_BRANCH → $TARGET_BRANCH"

          if [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
            MESSAGE="$MESSAGE
          Merged by: $MERGED_BY"
          fi

          MESSAGE="$MESSAGE

          $PR_URL"

          curl -X POST \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "$(jq -n --arg text "$MESSAGE" '{text: $text}')" \
            "$GOOGLE_CHAT_WEBHOOK"